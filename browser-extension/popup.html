<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fayda to Smart Branch</title>
  <style>
    body {
      width: 350px;
      min-height: 400px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      padding: 20px;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 20px;
      margin: 0 0 5px 0;
    }

    .header p {
      font-size: 12px;
      margin: 0;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .status {
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .status.idle {
      background: #f3f4f6;
      color: #6b7280;
    }

    .status.ready {
      background: #d1fae5;
      color: #065f46;
    }

    .status.extracting {
      background: #fef3c7;
      color: #92400e;
    }

    .status.success {
      background: #d1fae5;
      color: #065f46;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(to right, #E60000, #FF0000);
      color: white;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .data-preview {
      margin-top: 15px;
      padding: 15px;
      background: #f9fafb;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .data-preview h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #374151;
    }

    .data-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .data-item:last-child {
      border-bottom: none;
    }

    .data-label {
      font-weight: 600;
      color: #6b7280;
    }

    .data-value {
      color: #111827;
      text-align: right;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .instructions {
      font-size: 12px;
      color: #6b7280;
      margin-top: 15px;
      padding: 10px;
      background: #f9fafb;
      border-radius: 6px;
      line-height: 1.5;
    }

    .instructions ol {
      margin: 5px 0 0 0;
      padding-left: 20px;
    }

    .instructions li {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🇪🇹 Fayda Bridge</h1>
      <p>Ethiopian Digital ID to Smart Branch</p>
    </div>

    <div class="card">
      <div id="status" class="status idle">
        Waiting for action...
      </div>

      <button id="extractBtn" class="btn btn-primary">
        📤 Extract from Fayda
      </button>

      <button id="viewDataBtn" class="btn btn-secondary" style="display: none;">
        👁️ View Extracted Data
      </button>

      <button id="clearBtn" class="btn btn-secondary" style="display: none;">
        🗑️ Clear Data
      </button>

      <div id="dataPreview" class="data-preview" style="display: none;">
        <h3>Extracted Data:</h3>
        <div id="dataContent"></div>
      </div>

      <div class="instructions">
        <strong>How to use:</strong>
        <ol>
          <li>Open Fayda ID page in another tab</li>
          <li>Click "Extract from Fayda" button</li>
          <li>Data will be sent to Smart Branch automatically</li>
        </ol>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
